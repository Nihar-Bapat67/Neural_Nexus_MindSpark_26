# docker compose up --build
#   The repo-root .env provides the backend's runtime settings, and Compose reads the same
#   file to fill in the frontend's public SUPABASE_URL / SUPABASE_ANON_KEY build args.
# Always use --build after code changes; plain `up` reuses the previously built images.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # nginx (frontend) sits in front of the API and forwards the real client IP.
      TRUST_PROXY_HEADERS: "true"
      CORS_ORIGINS: "http://localhost:8080"
    ports:
      # Also published so a local `npm run dev` (Vite proxies /api to localhost:8000) can use this backend.
      - "8000:8000"
    volumes:
      - backend-data:/srv/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
